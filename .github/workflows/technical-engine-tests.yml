name: Mktradehome engine and approval tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check production and shadow Edge Functions
        run: deno check supabase/functions/market-monitor/index.ts supabase/functions/create-mt5-approval/index.ts supabase/functions/market-monitor-v100-shadow/index.ts supabase/functions/market-monitor-v100-backtest-shadow/index.ts supabase/functions/telegram-alerts/index.ts
      - name: Test independent approval proof against live strategy rules
        run: deno test --allow-read supabase/functions/_shared/approval-proof.test.ts
      - name: Test legacy shared-engine fixtures
        run: deno test supabase/functions/_shared/technical-engine.test.ts
