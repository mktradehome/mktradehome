name: Mktradehome engine and approval tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check production and shadow Edge Functions
        run: deno check supabase/functions/market-monitor/index.ts supabase/functions/create-mt5-approval/index.ts supabase/functions/market-monitor-v100-shadow/index.ts supabase/functions/market-monitor-v100-backtest-shadow/index.ts supabase/functions/market-monitor-v100-backtest-shadow/short-term-shadow.ts supabase/functions/market-foresight/index.ts supabase/functions/telegram-alerts/index.ts
      - name: Check dashboard inline JavaScript syntax
        run: node scripts/check-inline-js.mjs
      - name: Check Vision 2.0 navigation JavaScript syntax
        run: node --check vision2-dashboard.js
      - name: Check Vision 2.0 review-session JavaScript syntax
        run: node --check vision2-session.js
      - name: Test candidate geometry floating-point tolerance and risk boundaries
        run: deno test supabase/functions/market-monitor/candidate-geometry.test.ts
      - name: Test isolated short-term shadow candidate rules
        run: deno test supabase/functions/market-monitor-v100-backtest-shadow/short-term-shadow.test.ts
      - name: Test Market Foresight performance metrics
        run: deno test supabase/functions/_shared/foresight-performance.test.ts
      - name: Test Market Foresight horizon outcome resolution
        run: deno test supabase/functions/_shared/foresight-outcome.test.ts
      - name: Test independent approval proof against live strategy rules
        run: deno test --allow-read supabase/functions/_shared/approval-proof.test.ts
      - name: Test executable-side approval price and risk validation
        run: deno test supabase/functions/_shared/approval-price.test.ts
      - name: Test legacy shared-engine fixtures
        run: deno test supabase/functions/_shared/technical-engine.test.ts
