name: Technical engine tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [gpt-free-technical-engine]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run deterministic engine tests
        run: deno test supabase/functions/_shared/technical-engine.test.ts
