<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mktradehome - Set Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{background:#101827;color:white;font-family:Arial;padding:25px}

.box{max-width:400px;margin:70px auto;background:#1e293b;padding:25px;border-radius:14px}

h2{color:#f5c542}

input,button{width:100%;padding:14px;margin:10px 0;border-radius:8px;box-sizing:border-box}

input{background:#0f172a;color:white;border:1px solid #475569}

button{background:#eab308;color:#111827;font-weight:bold;border:0}

#message{font-size:14px;line-height:1.5}

</style>

</head>

<body>

<div class="box">

<h2>Set Your Password</h2>

<p>Create a new password for your Mktradehome account.</p>

<input id="password" type="password" placeholder="New password">

<input id="confirm" type="password" placeholder="Confirm new password">

<button onclick="savePassword()">Save New Password</button>

<p id="message">Checking your recovery link...</p>

</div>

<script>

const db=supabase.createClient(

"https://pjwqyveitncygamaaybi.supabase.co",

"sb_publishable_Ny_yyLQYsjyCNuGAn25ybw_ahxLPjwk",

{auth:{detectSessionInUrl:true,persistSession:true}}

);

let ready=false;

async function checkLink(){

 const {data,error}=await db.auth.getSession();

 if(error){

  document.getElementById("message").textContent=error.message;

  return;

 }

 if(data.session){

  ready=true;

  document.getElementById("message").textContent=

  "Recovery link verified. You can create your password.";

 }else{

  document.getElementById("message").textContent=

  "No recovery session found. Please use the latest password recovery email.";

 }

}

async function savePassword(){

 const password=document.getElementById("password").value;

 const confirm=document.getElementById("confirm").value;

 const message=document.getElementById("message");

 if(!ready){

  message.textContent="Your recovery link has not been verified.";

  return;

 }

 if(password.length<8){

  message.textContent="Password must contain at least 8 characters.";

  return;

 }

 if(password!==confirm){

  message.textContent="Passwords do not match.";

  return;

 }

 message.textContent="Saving your new password...";

 const {error}=await db.auth.updateUser({password});

 if(error){

  message.textContent="Error: "+error.message;

  return;

 }

 message.textContent="Password saved successfully! Redirecting...";

 setTimeout(()=>{

  window.location.href="./index.html";

 },2000);

}

checkLink();

</script>

</body>

</html>
