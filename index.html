<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#101827">

<title>Mktradehome | Personal Trading Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{font-family:Arial,sans-serif;background:#101827;color:#fff;padding:15px}

.container{max-width:850px;margin:auto}

header{padding:18px 0;border-bottom:1px solid #334155;margin-bottom:20px}

h1{font-size:25px;color:#f5c542}

.sub{color:#94a3b8;font-size:13px;margin-top:6px}

.card{background:#1e293b;padding:17px;border-radius:13px;margin-bottom:15px}

h2{font-size:18px;margin-bottom:13px}

h3{font-size:16px;margin-bottom:10px}

input,select,button{width:100%;padding:13px;border-radius:8px;border:1px solid #475569;margin:6px 0;background:#0f172a;color:white;font-size:15px}

button{background:#eab308;color:#111827;font-weight:bold;border:0;cursor:pointer}

button.secondary{background:#334155;color:white}

button.danger{background:#991b1b;color:white}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.market{border:1px solid #475569;padding:14px;border-radius:10px;margin:10px 0}

.price{font-size:22px;font-weight:bold;margin:8px 0}

.muted{color:#94a3b8;font-size:13px}

.green{color:#4ade80}

.red{color:#f87171}

.yellow{color:#facc15}

.badge{display:inline-block;padding:6px 10px;border-radius:6px;background:#334155;font-weight:bold;margin:5px 0}

.signal{font-size:20px;font-weight:bold;margin:10px 0}

.hidden{display:none}

.small{font-size:12px;color:#94a3b8;line-height:1.5}

hr{border:0;border-top:1px solid #475569;margin:12px 0}

.trade{padding:12px;background:#0f172a;border-radius:8px;margin:8px 0}

footer{text-align:center;color:#64748b;font-size:12px;padding:20px}

</style>

</head>

<body>

<div class="container">

<header>

<h1>MKTRADEHOME</h1>

<p class="sub">Your private trading analysis assistant</p>

</header>

<div id="loginBox" class="card">

<h2>Account Login</h2>

<input id="email" type="email" placeholder="Email address">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Sign In</button>

<p id="loginMessage" class="small"></p>

</div>

<div id="app" class="hidden">

<div class="card">

<div class="row">

<div>

<h2>Trading Dashboard</h2>

<p class="muted">Market monitoring and analysis</p>

</div>

<div>

<button class="secondary" onclick="logout()">Sign Out</button>

</div>

</div>

<p id="connection" class="yellow">Connecting...</p>

<p id="lastUpdated" class="small"></p>

</div>

<div class="card">

<h2>Markets</h2>

<div id="markets">

<p class="muted">Loading markets...</p>

</div>

<button onclick="refreshAll()">Refresh Analysis</button>

</div>

<div class="card">

<h2>Trade Risk Settings</h2>

<label class="small">Account balance (USD)</label>

<input id="balance" type="number" value="100">

<label class="small">Risk per trade (%)</label>

<input id="risk" type="number" value="1" min="0.1" max="5" step="0.1">

<button onclick="saveRisk()">Save Risk Settings</button>

<p id="riskMessage" class="small"></p>

</div>

<div class="card">

<h2>Record a Trade</h2>

<select id="tradeMarket">

<option>BTC/USD</option>

<option>EUR/USD</option>

<option>XAU/USD</option>

<option>USD/JPY</option>

</select>

<select id="tradeDirection">

<option>BUY</option>

<option>SELL</option>

</select>

<input id="tradeEntry" type="number" step="any" placeholder="Entry price">

<input id="tradeStop" type="number" step="any" placeholder="Stop loss">

<input id="tradeTarget" type="number" step="any" placeholder="Take profit">

<button onclick="addTrade()">Save Trade</button>

</div>

<div class="card">

<h2>Open Trades</h2>

<div id="openTrades"></div>

</div>

<div class="card">

<h2>Trade History</h2>

<div id="tradeHistory"></div>

</div>

</div>

<footer>

Mktradehome • Personal trading analysis tool

</footer>

</div>

<script>

const SUPABASE_URL = "https://pjwqyveitncygamaaybi.supabase.co";

const SUPABASE_KEY = "sb_publishable_Ny_yyLQYsjyCNuGAn25ybw_ahxLPjwk";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const markets = [

 {symbol:"BTCUSD",name:"BTC/USD"},

 {symbol:"EURUSD",name:"EUR/USD"},

 {symbol:"XAUUSD",name:"XAU/USD"},

 {symbol:"USDJPY",name:"USD/JPY"}

];

let latestQuotes = {};

let analyses = {};

let priceBusy = false;

function escapeHTML(value){

 return String(value).replace(/[&<>"']/g,function(c){

  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];

 });

}

async function login(){

 const email=document.getElementById("email").value.trim();

 const password=document.getElementById("password").value;

 document.getElementById("loginMessage").textContent="Signing in...";

 const {data,error}=await db.auth.signInWithPassword({email,password});

 if(error){

  document.getElementById("loginMessage").textContent=error.message;

  return;

 }

 showApp();

}

async function logout(){

 await db.auth.signOut();

 location.reload();

}

async function checkSession(){

 const {data}=await db.auth.getSession();

 if(data.session) showApp();

}

function showApp(){

 document.getElementById("loginBox").classList.add("hidden");

 document.getElementById("app").classList.remove("hidden");

 loadSettings();

 renderTrades();

 refreshAll();

 setInterval(fetchPrices,15000);

 setInterval(refreshAll,300000);

}

async function fetchPrices(){

 if(priceBusy)return;

 priceBusy=true;

 try{

  const url="https://biquote.io/api/latest?symbols=BTCUSD&symbols=EURUSD&symbols=XAUUSD&symbols=USDJPY";

  const response=await fetch(url);

  if(!response.ok)throw new Error("Price service unavailable");

  const data=await response.json();

  const rows=Array.isArray(data)?data:(data.quotes||data.data||[]);

  rows.forEach(q=>{

   const symbol=q.symbol||q.name;

   if(symbol){

    latestQuotes[symbol]=q;

   }

  });

  renderMarkets();

 }catch(error){

  document.getElementById("connection").textContent="Price connection error: "+error.message;

  document.getElementById("connection").className="red";

 }finally{

  priceBusy=false;

 }

}

function getPrice(symbol){

 const q=latestQuotes[symbol];

 if(!q)return null;

 return Number(q.mid||q.price||q.close||0);

}

function quoteIsFresh(symbol){

 const q=latestQuotes[symbol];

 if(!q)return false;

 const age=Number(q.quoteAgeSeconds);

 return q.stale===false &&

        q.marketState==="open" &&

        Number.isFinite(age) &&

        age<=300 &&

        getPrice(symbol)>0;

}

function renderMarkets(){

 const box=document.getElementById("markets");

 box.innerHTML=markets.map(m=>{

  const q=latestQuotes[m.symbol];

  const price=getPrice(m.symbol);

  const fresh=quoteIsFresh(m.symbol);

  return `

  <div class="market">

   <h3>${m.name}</h3>

   <div class="price">${price?price.toLocaleString("en-US",{maximumFractionDigits:5}):"Waiting for price..."}</div>

   <span class="badge ${fresh?"green":"yellow"}">

    ${fresh?"LIVE PRICE":"STALE / MARKET CLOSED"}

   </span>

   <p class="small">${q&&q.quoteAgeSeconds!==undefined?"Quote age: "+q.quoteAgeSeconds+" seconds":""}</p>

   <div id="signal-${m.symbol}">

    <p class="muted">Analysis not ready.</p>

   </div>

  </div>`;

 }).join("");

}

async function fetchCandles(symbol,interval){

 const url=`https://biquote.io/api/${symbol}/ohlc?interval=${interval}&limit=200`;

 const response=await fetch(url);

 if(!response.ok)throw new Error("Candle data unavailable for "+symbol+" "+interval);

 const data=await response.json();

 const bars=data.bars||data.data||data;

 if(!Array.isArray(bars))throw new Error("Invalid candle data");

 return bars.map(b=>({

  time:Number(b.openTime||b.time||b.timestamp),

  open:Number(b.open),

  high:Number(b.high),

  low:Number(b.low),

  close:Number(b.close),

  isOpen:b.isOpen===true

 })).filter(b=>

  Number.isFinite(b.time)&&

  Number.isFinite(b.open)&&

  Number.isFinite(b.high)&&

  Number.isFinite(b.low)&&

  Number.isFinite(b.close)

 ).filter(b=>!b.isOpen).sort((a,b)=>a.time-b.time);

}

function make3HourBars(hourBars){

 const groups={};

 hourBars.forEach(b=>{

  const start=Math.floor(b.time/10800000)*10800000;

  if(!groups[start])groups[start]=[];

  groups[start].push(b);

 });

 return Object.keys(groups).map(key=>{

  const group=groups[key].sort((a,b)=>a.time-b.time);

  if(group.length!==3)return null;

  return {

   time:Number(key),

   open:group[0].open,

   high:Math.max(...group.map(x=>x.high)),

   low:Math.min(...group.map(x=>x.low)),

   close:group[2].close

  };

 }).filter(Boolean);

}

function ema(values,period){

 if(values.length<period)return null;

 let result=values.slice(0,period).reduce((a,b)=>a+b,0)/period;

 const multiplier=2/(period+1);

 for(let i=period;i<values.length;i++){

  result=(values[i]-result)*multiplier+result;

 }

 return result;

}

function calculateRSI(values,period=14){

 if(values.length<=period)return null;

 let gains=0,losses=0;

 for(let i=values.length-period;i<values.length;i++){

  const change=values[i]-values[i-1];

  if(change>0)gains+=change;

  else loss+=0;

 }

 // Recalculate losses separately.

 gains=0;

 losses=0;

 for(let i=values.length-period;i<values.length;i++){

  const change=values[i]-values[i-1];

  if(change>0)gains+=change;

  else losses+=Math.abs(change);

 }

 if(losses===0)return 100;

 const rs=gains/losses;

 return 100-(100/(1+rs));

}

function calculateATR(bars,period=14){

 if(bars.length<=period)return null;

 const ranges=[];

 for(let i=1;i<bars.length;i++){

  const b=bars[i],previous=bars[i-1];

  ranges.push(Math.max(

   b.high-b.low,

   Math.abs(b.high-previous.close),

   Math.abs(b.low-previous.close)

  ));

 }

 return ranges.slice(-period).reduce((a,b)=>a+b,0)/period;

}

function analyzeTimeframe(bars){

 if(bars.length<60)throw new Error("Not enough candles");

 const closes=bars.map(b=>b.close);

 const fast=ema(closes,9);

 const slow=ema(closes,21);

 const rsi=calculateRSI(closes,14);

 const atr=calculateATR(bars,14);

 if(fast===null||slow===null||rsi===null||atr===null)

  throw new Error("Indicator calculation failed");

 let direction="WAIT";

 if(fast>slow&&rsi>50&&rsi<70)direction="BUY";

 if(fast<slow&&rsi<50&&rsi>30)direction="SELL";

 return {direction,fast,slow,rsi,atr,last:closes[closes.length-1]};

}

function buildSignal(results,price){

 const directions=Object.values(results).map(x=>x.direction);

 let direction="WAIT";

 if(directions.every(x=>x==="BUY"))direction="BUY";

 if(directions.every(x=>x==="SELL"))direction="SELL";

 const atr=results["1H"]?.atr||0;

 if(direction==="WAIT"||!price||!atr){

  return {direction,entry:price,stop:null,tp1:null,tp2:null};

 }

 const distance=atr*1.5;

 const entry=price;

 const stop=direction==="BUY"?entry-distance:entry+distance;

 const tp1=direction==="BUY"?entry+distance*1.5:entry-distance*1.5;

 const tp2=direction==="BUY"?entry+distance*2.5:entry-distance*2.5;

 return {direction,entry,stop,tp1,tp2};

}

async function analyzeMarket(m){

 const price=getPrice(m.symbol);

 if(!price)throw new Error("No current price");

 if(!quoteIsFresh(m.symbol))throw new Error("Price is stale or market is closed");

 const [bars5,bars15,bars1h]=await Promise.all([

  fetchCandles(m.symbol,"5m"),

  fetchCandles(m.symbol,"15m"),

  fetchCandles(m.symbol,"1h")

 ]);

 const bars3h=make3HourBars(bars1h);

 const results={

  "5M":analyzeTimeframe(bars5),

  "15M":analyzeTimeframe(bars15),

  "1H":analyzeTimeframe(bars1h),

  "3H":analyzeTimeframe(bars3h)

 };

 const signal=buildSignal(results,price);

 analyses[m.symbol]={results,signal};

 return analyses[m.symbol];

}

function renderAnalysis(m,result){

 const box=document.getElementById("signal-"+m.symbol);

 if(!box)return;

 const s=result.signal;

 const color=s.direction==="BUY"?"green":s.direction==="SELL"?"red":"yellow";

 let timeframes=Object.entries(result.results).map(([tf,r])=>

  `<p class="small">${tf}: <b>${r.direction}</b> | RSI: ${r.rsi.toFixed(1)}</p>`

 ).join("");

 let levels="";

 if(s.direction!=="WAIT"){

  levels=`

   <hr>

   <p>Entry: ${s.entry.toFixed(5)}</p>

   <p>Stop Loss: ${s.stop.toFixed(5)}</p>

   <p>Take Profit 1: ${s.tp1.toFixed(5)}</p>

   <p>Take Profit 2: ${s.tp2.toFixed(5)}</p>

   <p class="small">Estimated reward/risk: TP1 1:1.5 | TP2 1:2.5</p>

  `;

 }

 box.innerHTML=`

  <div class="signal ${color}">${s.direction}</div>

  <p class="small">Timeframe analysis</p>

  ${timeframes}

  ${levels}

 `;

}

async function refreshAll(){

 document.getElementById("connection").textContent="Updating market data...";

 document.getElementById("connection").className="yellow";

 await fetchPrices();

 for(const m of markets){

  const box=document.getElementById("signal-"+m.symbol);

  if(box)box.innerHTML='<p class="muted">Analyzing...</p>';

 }

 for(const m of markets){

  try{

   const result=await analyzeMarket(m);

   renderAnalysis(m,result);

  }catch(error){

   const box=document.getElementById("signal-"+m.symbol);

   if(box){

    box.innerHTML=`<p class="yellow">WAIT</p><p class="small">${escapeHTML(error.message)}</p>`;

   }

  }

 }

 document.getElementById("connection").textContent="Analysis updated. Check quote freshness before trading.";

 document.getElementById("connection").className="green";

 document.getElementById("lastUpdated").textContent="Last update: "+new Date().toLocaleString();

}

function loadSettings(){

 const saved=JSON.parse(localStorage.getItem("mkRisk")||"{}");

 if(saved.balance)document.getElementById("balance").value=saved.balance;

 if(saved.risk)document.getElementById("risk").value=saved.risk;

}

function saveRisk(){

 const balance=Number(document.getElementById("balance").value);

 const risk=Number(document.getElementById("risk").value);

 if(balance<=0||risk<=0||risk>5){

  document.getElementById("riskMessage").textContent="Enter a valid balance and risk between 0.1% and 5%.";

  return;

 }

 localStorage.setItem("mkRisk",JSON.stringify({balance,risk}));

 document.getElementById("riskMessage").textContent="Risk settings saved.";

}

function getTrades(){

 return JSON.parse(localStorage.getItem("mkTrades")||"[]");

}

function saveTrades(trades){

 localStorage.setItem("mkTrades",JSON.stringify(trades));

}

function addTrade(){

 const market=document.getElementById("tradeMarket").value;

 const direction=document.getElementById("tradeDirection").value;

 const entry=Number(document.getElementById("tradeEntry").value);

 const stop=Number(document.getElementById("tradeStop").value);

 const target=Number(document.getElementById("tradeTarget").value);

 if(!entry||!stop||!target){

  alert("Please enter all trade prices.");

  return;

 }

 if(direction==="BUY"&&(stop>=entry||target<=entry)){

  alert("For a BUY, stop loss must be below entry and target above entry.");

  return;

 }

 if(direction==="SELL"&&(stop<=entry||target>=entry)){

  alert("For a SELL, stop loss must be above entry and target below entry.");

  return;

 }

 const trades=getTrades();

 trades.unshift({

  id:Date.now(),

  market,

  direction,

  entry,

  stop,

  target,

  status:"OPEN",

  created:new Date().toLocaleString()

 });

 saveTrades(trades);

 renderTrades();

 document.getElementById("tradeEntry").value="";

 document.getElementById("tradeStop").value="";

 document.getElementById("tradeTarget").value="";

}

function closeTrade(id){

 const trades=getTrades();

 const trade=trades.find(t=>t.id===id);

 if(!trade)return;

 trade.status="CLOSED";

 trade.closed=new Date().toLocaleString();

 saveTrades(trades);

 renderTrades();

}

function renderTrades(){

 const trades=getTrades();

 const open=trades.filter(t=>t.status==="OPEN");

 const closed=trades.filter(t=>t.status==="CLOSED");

 document.getElementById("openTrades").innerHTML=open.length?open.map(t=>`

  <div class="trade">

   <b>${escapeHTML(t.market)} — ${escapeHTML(t.direction)}</b>

   <p class="small">Entry: ${t.entry} | SL: ${t.stop} | TP: ${t.target}</p>

   <p class="small">${escapeHTML(t.created)}</p>

   <button class="danger" onclick="closeTrade(${t.id})">Close Trade</button>

  </div>

 `).join(""):"<p class='muted'>No open trades.</p>";

 document.getElementById("tradeHistory").innerHTML=closed.length?closed.map(t=>`

  <div class="trade">

   <b>${escapeHTML(t.market)} — ${escapeHTML(t.direction)}</b>

   <p class="small">Entry: ${t.entry} | SL: ${t.stop} | TP: ${t.target}</p>

   <p class="small">Closed: ${escapeHTML(t.closed||"")}</p>

  </div>

 `).join(""):"<p class='muted'>No closed trades yet.</p>";

}

db.auth.onAuthStateChange((event,session)=>{

 if(session)showApp();

});

checkSession();

</script>

</body>

</html>
