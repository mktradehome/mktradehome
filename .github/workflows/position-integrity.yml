name: Position integrity and dashboard syntax

on:
  push:
    branches:
      - research/signal-consolidation-and-live-positions
    paths:
      - "index.html"
      - "supabase/functions/_shared/mt5-position-snapshot.ts"
      - "supabase/functions/mt5-bridge/**"
      - "tests/**"
      - ".github/workflows/position-integrity.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "supabase/functions/_shared/mt5-position-snapshot.ts"
      - "supabase/functions/mt5-bridge/**"
      - "tests/**"
      - ".github/workflows/position-integrity.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check dashboard inline JavaScript syntax
        run: node tests/check-dashboard-syntax.mjs
      - name: Test MT5 position snapshot integrity
        run: deno test supabase/functions/mt5-bridge/position-snapshot.test.ts
      - name: Type-check MT5 position validator
        run: deno check supabase/functions/_shared/mt5-position-snapshot.ts
